services:
  mysql:
    image: mysql:8.4
    container_name: kping-mysql
    environment:
      # application.yaml의 기본값(DB_PASSWORD 비어있음)과 맞춰 둔다.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: kping
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - kping-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kping-mysql-data:
