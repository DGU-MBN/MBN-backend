spring:
  application:
    name: MBN
  config:
    import: optional:application-local.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kping}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # precision, primary 등 MySQL 예약어와 겹치는 컬럼명을 자동으로 백틱 처리한다.
        # 엔티티가 늘어날 때마다 예약어를 따로 찾아다니지 않기 위함.
        auto_quote_keyword: true

# 실제 키는 절대 여기(git 추적 파일) 넣지 말 것.
# gitignore된 application-local.yaml에 NAVER_CLIENT_ID 등으로 넣으면 아래 ${}가 읽어온다.
naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
